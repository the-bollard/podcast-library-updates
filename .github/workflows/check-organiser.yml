name: Check Podcasts Organiser
on:
  push:
    branches: [main]
    paths:
      - 'organiser/**'
      - '.github/workflows/check-organiser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-contained browser editor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('organiser/index.html', 'utf8');
          const code = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!code) throw new Error('Inline editor script missing');
          new Function(code);
          if (!html.includes('podcasts-organiser') || !html.includes('baselinePlacements')) {
            throw new Error('Expected organiser transfer format missing');
          }
          if (/<script[^>]+src=/.test(html) || /\bfetch\s*\(/.test(code)) {
            throw new Error('Editor must remain self-contained and make no fetch requests');
          }
          // Smoke-test actual title grouping against examples from the library.
          const start = code.indexOf('function suggestedArcBase(title) {');
          const end = code.indexOf('function suggestArcNames()', start);
          if (start < 0 || end < 0) throw Error('Arc matching helpers missing');
          const episodes = [
            {key:'gaslight1', title:'Cthulhu by Gaslight Part 1 | Omnihedral'},
            {key:'gaslight2', title:'Cthulhu by Gaslight Part 2 | Omnihedral'},
            {key:'gaslight3', title:'Cthulhu by Gaslight Part 3 | Omnihedral'},
            {key:'time1', title:'Time Without Tide Part 1'},
            {key:'other', title:'Cthulhu by Gaslight: Behind the Scenes'}
          ];
          const helpers = new Function('links', 'feedEpisodes',
            code.slice(start, end) + '; return {suggestedArcBase,matchingUnassignedEpisodes};')(
            () => [{episodeKey:'gaslight3'}], () => episodes
          );
          if (helpers.suggestedArcBase(episodes[0].title).name !== 'Cthulhu by Gaslight') {
            throw Error('Part / source suffix not removed correctly');
          }
          const gauntlet = [
            {key:'g1',title:'Space Journalism | Gen Con 2026 Gauntlet Prep Part 1 | Traveller'},
            {key:'g2',title:'Cooking with Class | Gen Con 2026 Gauntlet Prep Part 2 | Traveller'},
            {key:'g3',title:'The Bums Lost | Gen Con 2026 Gauntlet Prep Part 4 | Traveller'},
            {key:'othertraveller',title:'Another Adventure | Different Arc Part 1 | Traveller'}
          ];
          if (gauntlet.some((ep,index) =>
              (index < 3 ? helpers.suggestedArcBase(ep.title).name !== 'Gen Con 2026 Gauntlet Prep'
                         : helpers.suggestedArcBase(ep.title).name !== 'Different Arc'))) {
            throw Error('Pipe-delimited arc must be taken from numbered middle segment, not episode title or game system');
          }
          const gauntletMatch = new Function('links','feedEpisodes',
            code.slice(start,end)+'; return matchingUnassignedEpisodes;')(
            () => [{episodeKey:'g2'}], () => gauntlet
          );
          if (gauntletMatch('Gen Con 2026 Gauntlet Prep').map(x=>x.key).join(',') !== 'g1,g3' ||
              gauntletMatch('Traveller').length !== 0) {
            throw Error('Gauntlet grouping must ignore Traveller label and existing assignments');
          }
          const exact = helpers.matchingUnassignedEpisodes('Cthulhu by Gaslight').map(e => e.key);
          if (exact.join(',') !== 'gaslight1,gaslight2') {
            throw Error('Automatic matching must include exact unassigned parts only');
          }
          if (helpers.matchingUnassignedEpisodes('Gaslight').length) {
            throw Error('Loose substring matches are unsafe');
          }
          if (helpers.matchingUnassignedEpisodes('Time Without Tide').length !== 1) {
            throw Error('Single part matching failed');
          }
          const seasonEpisodes = [
            {key:'s1a', title:'S1E01 - The Beginning'},
            {key:'s1b', title:'S01E03: A New Clue'},
            {key:'s1c', title:'Season 1 Episode 4 - Finale'},
            {key:'s1d', title:'S1 - Season 1'},
            {key:'s2a', title:'S2E01 - Next Chapter'},
            {key:'s10', title:'S10E01 - Much Later'},
            {key:'s1placed', title:'Season 1 Episode 5'},
            {key:'noise', title:'Christmas1 Countdown'}
          ];
          // Keep the extracted helpers free of UI initialisation and dialog handlers.
          const seasonEnd = code.indexOf('function planAutomaticOrganisation()', start);
          const seasonHelpers = new Function('links', 'feedEpisodes', 'feedSections',
            code.slice(start, seasonEnd) +
            '; return {episodeSeason,arcSeason,matchingUnassignedEpisodes,suggestArcNames};')(
              () => [{episodeKey:'s1placed'}], () => seasonEpisodes, () => []
            );
          const one = seasonHelpers.matchingUnassignedEpisodes('Season 1').map(e=>e.key).join(',');
          if (one !== 's1a,s1b,s1c,s1d') throw Error('S1/Season 1 matching is incorrect: '+one);
          if (seasonHelpers.matchingUnassignedEpisodes('S01').length !== 4) {
            throw Error('S01 alias must match Season 1');
          }
          if (seasonHelpers.matchingUnassignedEpisodes('Season 2').map(e=>e.key).join(',') !== 's2a') {
            throw Error('Other seasons must not be mixed');
          }
          if (seasonHelpers.episodeSeason('S10E01') !== 10 ||
              seasonHelpers.episodeSeason('Christmas1 Countdown') !== null) {
            throw Error('Season number boundary is incorrect');
          }
          const suggested = seasonHelpers.suggestArcNames();
          if (suggested.find(x=>x.name==='Season 1')?.count !== 4) {
            throw Error('Season 1 suggestion must count only unassigned matching episodes');
          }
          const autoStart = code.indexOf('function planAutomaticOrganisation()', seasonEnd);
          const autoEnd = code.indexOf('const autoDialog =', autoStart);
          if (autoStart < 0 || autoEnd < 0) throw Error('Automatic organiser helper missing');
          const getPlan = new Function('library','activeFeed','feedEpisodes','links','feedSections',
            'episodeSeason','suggestedArcBase','arcSeason',
            code.slice(autoStart, autoEnd) + ';return planAutomaticOrganisation;')(
              {format:'podcasts-organiser'}, 1, () => [
                {key:'gas1',title:'Cthulhu by Gaslight Part 1'},
                {key:'gas2',title:'Cthulhu by Gaslight Part 2'},
                {key:'solo',title:'Time Without Tide Part 1'},
                {key:'placed',title:'Cthulhu by Gaslight Part 3'}
              ], () => [{episodeKey:'placed'}], () => [
                {id:3,name:'Time Without Tide',subscriptionId:1}
              ],
              seasonHelpers.episodeSeason, helpers.suggestedArcBase,seasonHelpers.arcSeason
            );
          const planned = getPlan();
          if (planned.find(x=>x.name==='Cthulhu by Gaslight')?.episodes.length !== 2 ||
              !planned.find(x=>x.name==='Cthulhu by Gaslight')?.recommended ||
              planned.find(x=>x.name==='Time Without Tide')?.collectionId !== 3) {
            throw Error('Automatic organisation must suggest groups and safely reuse existing arcs');
          }
          const rangeStart = code.indexOf('function chronologicalEpisodes()', autoEnd);
          const rangeEnd = code.indexOf('function updateArcMatchPreview()', rangeStart);
          if (rangeStart < 0 || rangeEnd < 0) throw Error('Episode range helpers missing');
          const fullEpisodes = [
            {key:'third',title:'Third episode',published:300},
            {key:'first',title:'First episode',published:100},
            {key:'fourth',title:'Fourth episode',published:400},
            {key:'second',title:'Second episode',published:200}
          ];
          const ranges = new Function('feedEpisodes','links',
            code.slice(rangeStart,rangeEnd)+';return {episodeRange,episodeRangeSummary};')(
              ()=>fullEpisodes, ()=>[{episodeKey:'second'}]
            );
          const subset = ranges.episodeRange('2-3');
          if (subset.start!==2 || subset.end!==3 || subset.skipped!==1 ||
              subset.episodes.map(e=>e.key).join(',')!=='third') {
            throw Error('Episode range must be chronological and leave existing assignments alone');
          }
          if (!ranges.episodeRange('3-2').error || !ranges.episodeRange('1-10').error) {
            throw Error('Invalid ranges must be rejected');
          }
          console.log('Organiser JavaScript, privacy, auto-groups, seasons and episode ranges passed');
          NODE
