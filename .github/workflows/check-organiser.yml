name: Check Podcasts Organiser
on:
  push:
    branches: [main]
    paths:
      - 'organiser/**'
      - '.github/workflows/check-organiser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-contained browser editor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('organiser/index.html', 'utf8');
          const code = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!code) throw new Error('Inline editor script missing');
          new Function(code);
          if (!html.includes('podcasts-organiser') || !html.includes('baselinePlacements')) {
            throw new Error('Expected organiser transfer format missing');
          }
          if (/<script[^>]+src=/.test(html) || /\bfetch\s*\(/.test(code)) {
            throw new Error('Editor must remain self-contained and make no fetch requests');
          }
          // Smoke-test actual title grouping against examples from the library.
          const start = code.indexOf('function suggestedArcBase(title) {');
          const end = code.indexOf('function suggestArcNames()', start);
          if (start < 0 || end < 0) throw Error('Arc matching helpers missing');
          const episodes = [
            {key:'gaslight1', title:'Cthulhu by Gaslight Part 1 | Omnihedral'},
            {key:'gaslight2', title:'Cthulhu by Gaslight Part 2 | Omnihedral'},
            {key:'gaslight3', title:'Cthulhu by Gaslight Part 3 | Omnihedral'},
            {key:'time1', title:'Time Without Tide Part 1'},
            {key:'other', title:'Cthulhu by Gaslight: Behind the Scenes'}
          ];
          const helpers = new Function('links', 'feedEpisodes',
            code.slice(start, end) + '; return {suggestedArcBase,matchingUnassignedEpisodes};')(
            () => [{episodeKey:'gaslight3'}], () => episodes
          );
          if (helpers.suggestedArcBase(episodes[0].title).name !== 'Cthulhu by Gaslight') {
            throw Error('Part / source suffix not removed correctly');
          }
          const exact = helpers.matchingUnassignedEpisodes('Cthulhu by Gaslight').map(e => e.key);
          if (exact.join(',') !== 'gaslight1,gaslight2') {
            throw Error('Automatic matching must include exact unassigned parts only');
          }
          if (helpers.matchingUnassignedEpisodes('Gaslight').length) {
            throw Error('Loose substring matches are unsafe');
          }
          if (helpers.matchingUnassignedEpisodes('Time Without Tide').length !== 1) {
            throw Error('Single part matching failed');
          }
          const seasonEpisodes = [
            {key:'s1a', title:'S1E01 - The Beginning'},
            {key:'s1b', title:'S01E03: A New Clue'},
            {key:'s1c', title:'Season 1 Episode 4 - Finale'},
            {key:'s1d', title:'S1 - Season 1'},
            {key:'s2a', title:'S2E01 - Next Chapter'},
            {key:'s10', title:'S10E01 - Much Later'},
            {key:'s1placed', title:'Season 1 Episode 5'},
            {key:'noise', title:'Christmas1 Countdown'}
          ];
          const seasonEnd = code.indexOf('function updateArcMatchPreview()', start);
          const seasonHelpers = new Function('links', 'feedEpisodes', 'feedSections',
            code.slice(start, seasonEnd) +
            '; return {episodeSeason,arcSeason,matchingUnassignedEpisodes,suggestArcNames};')(
              () => [{episodeKey:'s1placed'}], () => seasonEpisodes, () => []
            );
          const one = seasonHelpers.matchingUnassignedEpisodes('Season 1').map(e=>e.key).join(',');
          if (one !== 's1a,s1b,s1c,s1d') throw Error('S1/Season 1 matching is incorrect: '+one);
          if (seasonHelpers.matchingUnassignedEpisodes('S01').length !== 4) {
            throw Error('S01 alias must match Season 1');
          }
          if (seasonHelpers.matchingUnassignedEpisodes('Season 2').map(e=>e.key).join(',') !== 's2a') {
            throw Error('Other seasons must not be mixed');
          }
          if (seasonHelpers.episodeSeason('S10E01') !== 10 ||
              seasonHelpers.episodeSeason('Christmas1 Countdown') !== null) {
            throw Error('Season number boundary is incorrect');
          }
          const suggested = seasonHelpers.suggestArcNames();
          if (suggested.find(x=>x.name==='Season 1')?.count !== 4) {
            throw Error('Season 1 suggestion must count only unassigned matching episodes');
          }
          console.log('Organiser JavaScript, privacy, named arc and S1/Season 1 auto-fill checks passed');
          NODE
